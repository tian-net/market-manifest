apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: marketplace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: tian11qb/market-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: MONGO_URI
          value: "mongodb://<MONGO_EC2_IP>:27017/tourism_marketplace"
